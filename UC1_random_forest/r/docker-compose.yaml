services:
  openeocubes-backend:
    image: brianpondi/openeocubes
    platform: linux/amd64
    container_name: openeocubes-backend
    ports:
      - "${OPENEO_PORT:-8000}:8000"
    environment:
      TZ: Etc/UTC
      OPENEO_ASYNC_JOB_TIMEOUT_SEC: "3600"
      OPENEO_STALE_OUTPUT_FINALIZE_SEC: "30"

  uc1-random-forest-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openeocubes-uc1-rf
    network_mode: service:openeocubes-backend
    depends_on:
      openeocubes-backend:
        condition: service_started
    working_dir: /work
    environment:
      OPENEO_HOST: ${OPENEO_HOST:-http://127.0.0.1:8000}
      OPENEO_USER: ${OPENEO_USER:-user}
      OPENEO_PASSWORD: ${OPENEO_PASSWORD:-password}
      OUTPUT_DIR: /work/results
      PROCESS_GRAPH: /work/full_pg.json
    volumes:
      - ./run_pg.py:/work/run_pg.py:ro
      - ./full_pg.json:/work/full_pg.json:ro
      - ./results:/work/results
    command: ["uv", "run", "run_pg.py"]
