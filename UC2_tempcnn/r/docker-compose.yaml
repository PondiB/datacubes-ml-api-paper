services:
  openeocraft-backend:
    image: brianpondi/openeocraft:latest
    container_name: openeocraft-backend
    # Force x86_64 architecture — torch (used by sits/TempCNN) does not provide
    # ARM64 Linux binaries, so the image must run as amd64 even on Apple Silicon.
    # On M-series Macs: enable Rosetta in Docker Desktop → Settings → General
    # ("Use Rosetta for x86_64/amd64 emulation") for faster emulation.
    platform: linux/amd64
    ports:
      - "${OPENEO_PORT:-8001}:8000"
    environment:
      OPENEOCRAFT_API_BASE_URL: ${OPENEOCRAFT_API_BASE_URL:-http://openeocraft-backend:8000}
      R_PROFILE_USER: /etc/openeocraft/Rprofile
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-1}
    command:
      - bash
      - /etc/openeocraft/entrypoint.sh
    volumes:
      - ./openeocraft-backend.Rprofile:/etc/openeocraft/Rprofile:ro
      - ./backend-entrypoint.sh:/etc/openeocraft/entrypoint.sh:ro
    deploy:
      resources:
        limits:
          cpus: "${OPENEOCRAFT_CPU_LIMIT:-8}"
          memory: "${OPENEOCRAFT_MEM_LIMIT:-16g}"

  uc2-tempcnn-r:
    image: brianpondi/openeocraft:latest
    container_name: openeocraft-uc2-tempcnn-r
    # Force x86_64 — same reason as above (torch ARM64 Linux binaries unavailable).
    platform: linux/amd64
    depends_on:
      openeocraft-backend:
        condition: service_started
    working_dir: /work
    command:
      - bash
      - -lc
      - >
        Rscript -e "if (!requireNamespace('openeo', quietly = TRUE)) {
          if (!requireNamespace('remotes', quietly = TRUE)) install.packages('remotes', repos='https://cloud.r-project.org');
          remotes::install_github('Open-EO/openeo-r-client', upgrade='never')
        }"
        && python3 -m pip install -q matplotlib numpy rasterio
        && Rscript /work/usecase2.R
    environment:
      OPENEO_HOST: ${OPENEO_HOST:-http://openeocraft-backend:8000}
      OPENEO_USER: ${OPENEO_USER:-brian}
      OPENEO_PASSWORD: ${OPENEO_PASSWORD:-123456}
      OUTPUT_DIR: /work/results
      JOB_POLL_SECONDS: ${JOB_POLL_SECONDS:-30}
      UC2_REGULARIZE_PERIOD: ${UC2_REGULARIZE_PERIOD:-P16D}
      UC2_GRID_RESOLUTION: ${UC2_GRID_RESOLUTION:-30}
      UC2_SPATIAL_AREA_FRACTION: ${UC2_SPATIAL_AREA_FRACTION:-1}
      UC2_COLLECTION_BANDS: ${UC2_COLLECTION_BANDS:-}
      JOB_MAX_WAIT_SECONDS: ${JOB_MAX_WAIT_SECONDS:-172800}
    volumes:
      - ./usecase2.R:/work/usecase2.R:ro
      - ./visualize.py:/work/visualize.py:ro
      - ./results:/work/results
